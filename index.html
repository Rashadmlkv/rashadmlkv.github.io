<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        :root {
            --bg-main: #F9F7F7;
            --bg-card: #DBE2EF;
            --primary: #3F72AF;
            --text-dark: #112D4E;
            --white: #FFFFFF;
        }

        * {
    -webkit-tap-highlight-color: rgba(0,0,0,0);            
box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-dark);
            display: flex;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            display: flex;
            width: 900px;
            max-width: 100%;
            min-height: 550px;
            background: var(--white);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(17, 45, 78, 0.1);
            overflow: hidden;
        }

        /* Left Branding Panel */
        .brand-panel {
            background-color: var(--text-dark);
            color: var(--white);
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .brand-panel h1 {
            font-size: 2rem;
            font-weight: 700;
        }

        .brand-panel p {
            color: var(--bg-card);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        /* Right Form Panel */
        .form-panel {
            flex: 1;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-header h2 {
            font-size: 1.75rem;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .form-header p {
            color: #607597;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-dark);
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--bg-main);
            border: 1px solid var(--bg-card);
            border-radius: 8px;
            font-size: 0.95rem;
            color: var(--text-dark);
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
            background-color: var(--white);
            box-shadow: 0 0 0 3px rgba(63, 114, 175, 0.15);
        }

        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            margin-bottom: 25px;
        }

        .form-actions label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .form-actions a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .form-actions a:hover {
            text-decoration: underline;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
    -webkit-tap-highlight-color: rgba(0,0,0,0);
            transition: background-color 0.2s ease;
        }

        .btn-submit:hover {
            background-color: #325d91;
    -webkit-tap-highlight-color: rgba(0,0,0,0);

        }

        .signup-prompt {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: #607597;
    -webkit-tap-highlight-color: rgba(0,0,0,0);

        }

        .signup-prompt a {
            color: var(--primary);
            text-decoration: none;
    -webkit-tap-highlight-color: rgba(0,0,0,0);

            font-weight: 600;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .login-container {
                flex-direction: column;
                width: 100%;
                min-height: 100vh;
                border-radius: 0;
            }
            .brand-panel {
                padding: 30px;
                min-height: 150px;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- Left Branding Area -->
        <div class="brand-panel">
            <div>
                <h1>Workspace.</h1>
            </div>
            <div>
                <p>Welcome back! Streamline your workflow and collaborate securely with your team.</p>
            </div>
            <div style="font-size: 0.8rem; color: var(--bg-card);">
                &copy; 2026 Company Name
            </div>
        </div>

        <!-- Right Form Area -->
        <div class="form-panel">
            <div class="form-header">
                <h2>Sign In</h2>
                <p>Please enter your details to access your account.</p>
            </div>

            <form>
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="name@example.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <div class="form-actions">
                    <label>
                        <input type="checkbox" style="accent-color: var(--primary);"> Remember me
                    </label>
                    <a href="#">Forgot password?</a>
                </div>

                <button type="submit" class="btn-submit">Sign In</button>
            </form>

            <div class="signup-prompt">
                Don't have an account? <a href="#">Sign up</a>
            </div>
        </div>
    </div>

</body>
</html>
